<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侦探 · 元宝搜索配置</title><style>
:root{color-scheme:light;--ink:#17251e;--muted:#657369;--line:#d6ddd2;--paper:#f4f4eb;--green:#19684a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:44px 28px 64px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;font-size:13px;font-weight:650;letter-spacing:.06em}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:8px}.intro{padding:46px 0 34px}h1{font-size:clamp(30px,4vw,48px);line-height:1.22;letter-spacing:-.04em;margin:0 0 15px}.intro p{color:var(--muted);max-width:640px;margin:0}section{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{border:1px solid var(--line);border-radius:18px;padding:28px;background:#fffef9;display:flex;flex-direction:column}.eyebrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}.badge{border:1px solid var(--line);padding:3px 9px;border-radius:20px;color:var(--muted);font-weight:500}.card h2{font-size:27px;line-height:1.3;margin:20px 0 9px;letter-spacing:-.03em}.desc{color:var(--muted);margin:0 0 24px;min-height:54px}.steps{padding-left:22px;margin:0 0 22px;font-size:14px}.steps li{padding:4px 0}a{color:var(--green);text-underline-offset:3px}label{font-size:13px;font-weight:600;display:block;margin-bottom:8px}input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:white;font:14px ui-monospace,monospace;outline:none}input:focus{border-color:var(--green);box-shadow:0 0 0 3px #19684a16}.check{display:flex;align-items:flex-start;gap:9px;line-height:1.5;font-size:12px;font-weight:400;color:var(--muted);margin:13px 0}.check input{margin-top:3px;accent-color:var(--green)}form{margin-top:auto}button{width:100%;border:0;border-radius:9px;padding:13px 16px;background:var(--green);color:white;font:600 14px inherit;cursor:pointer;margin-top:12px}button:disabled{opacity:.55;cursor:wait}.hint{font-size:12px;color:var(--muted);margin:9px 0 0}.result{font-size:13px;min-height:22px;margin-top:12px;color:var(--green);overflow-wrap:anywhere}.result.error{color:#ad3726}footer{margin-top:22px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px}footer p{margin:6px 0}@media(max-width:720px){main{padding:24px 18px}section{grid-template-columns:1fr}.intro{padding:32px 0}.card{padding:23px}header span:last-child{display:none}.desc{min-height:0}} 
main{max-width:800px}section{grid-template-columns:1fr}.desc{min-height:0}.intro{padding-bottom:28px}.card{padding:28px 32px}:root{--green:#254be5;--ink:#202521;--muted:#747b76;--paper:#f5f3ec}</style><main><header><span>1024 / 侦探 · 元宝搜索配置</span><span><i class="dot"></i>仅在这台电脑配置</span></header><div class="intro"><h1>先接通搜索，再找证据。</h1><p>为 AI 宣传查证所连接元宝搜索。登录、实名认证与额度领取在官方平台完成。</p></div><section><article class="card"><div class="eyebrow"><span>侦探赛道</span><span class="badge" id="detective-status">未连接</span></div><h2>AI 宣传查证所</h2><p class="desc">从一句公开产品宣传出发，找原始出处、查限制条件，再带着证据回来。</p><ol class="steps"><li>在比赛官网「我的福利」进入侦探赛道群，领取并核销搜索额度。</li><li>登录 <a href="https://console.cloud.tencent.com/wsapi/index" target="_blank" rel="noreferrer">元宝搜索控制台 ↗</a>，完成实名认证、开通服务。</li><li>创建「服务 API Key」，复制后填写在下方。<a href="https://cloud.tencent.com/document/product/1806/130615" target="_blank" rel="noreferrer">官方步骤 ↗</a></li></ol><form data-kind="detective"><label for="yuanbao-key">元宝搜索 · 服务 API Key</label><input type="password" id="yuanbao-key" name="secret" autocomplete="off" placeholder="填写服务 API Key" required><label class="check"><input type="checkbox" name="freeQuotaConfirmed" required><span>我已在官方控制台确认有可用的免费搜索额度。连接测试会使用 1 次搜索。</span></label><button type="submit">验证连接并保存到本机</button><div class="result" role="status" aria-live="polite"></div></form></article></section><footer><p>验证成功后，回到侦探项目开始查证。密钥只保存在本机。</p></footer></main><script nonce="__CSRF__">const kind="detective";
async function refresh(){const s=await fetch('/settings/status').then(r=>r.json());document.getElementById(kind+'-status').textContent=s.verifiedAt?'已验证 · 本机保存':s.configured?'已配置 · 待验证':'待连接'}
const form=document.querySelector('form');form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button'),result=form.querySelector('.result');button.disabled=true;result.className='result';result.textContent='正在连接官方服务…';const field=form.elements.secret;try{const response=await fetch('/settings/connect',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':'__CSRF__'},body:JSON.stringify({secret:field.value,freeQuotaConfirmed:form.elements.freeQuotaConfirmed?.checked===true})});const data=await response.json();if(!response.ok)throw new Error(data.error);result.textContent=data.message;field.value='';await refresh()}catch(error){result.className='result error';result.textContent=error.message}finally{button.disabled=false}});refresh().catch(()=>{});
</script></html>
